# Tầng 2 (commit 2): Prometheus + Grafana, cAdvisor, nginx-exporter, mysqld-exporter.
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [mon_net, mgmt]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        (while true; do
          for d in /var/lib/docker/containers/*; do
            [ -d "$$d" ] || continue
            id=$$(basename "$$d")
            m="/var/lib/docker/image/overlayfs/layerdb/mounts/$$id/mount-id"
            if [ ! -f "$$m" ]; then
              mkdir -p "$$(dirname "$$m")" 2>/dev/null && printf '%s' "$$id" > "$$m" 2>/dev/null || true
            fi
          done
          sleep 5
        done) &
        exec /usr/bin/cadvisor --store_container_labels=false --whitelisted_container_labels=com.docker.compose.service --docker_only=true --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:rw
      - /var/lib/docker/:/rootfs/var/lib/docker:rw
    security_opt: ["no-new-privileges:true"]
    networks: [mon_net]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on: [nginx]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [mon_net]

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    restart: unless-stopped
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_DB_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [db_net, mon_net]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/he-thong.json
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN}
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [mon_net, mgmt]

  # Bổ sung mạng giám sát cho các dịch vụ ở file gốc để Prometheus cào được số liệu
  webapp:
    networks: [mon_net]
  nginx:
    networks: [mon_net]

networks:
  mon_net:                # mạng giám sát, internal: true nên không ra Internet
    internal: true

volumes:
  prometheus_data:
  grafana_data:
