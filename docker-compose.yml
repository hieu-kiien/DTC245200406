# Portfolio Nguyễn Đức Dũng - Đề 13 - DTC245200406
# Tầng 1 (commit 1): ứng dụng, MySQL, phpMyAdmin, Nginx.
# Tầng giám sát và tầng log nằm ở hai file riêng, nối vào bằng biến COMPOSE_FILE trong .env.
name: dtc245200406

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    user: "999:999"                     # uid của người dùng mysql trong image, không chạy bằng root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      PMA_DB_PASSWORD: ${PMA_DB_PASSWORD}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [db_net]

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_ARBITRARY: "0"                # không cho nhập máy chủ tùy ý trên màn hình đăng nhập
    ports: ["127.0.0.1:8081:80"]        # chỉ mở trên máy chủ, không ra mạng ngoài
    depends_on:
      db: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]
    networks: [db_net, mgmt]

  webapp:
    build: ./app
    image: dtc245200406/portfolio:1.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: portfolio_app             # tài khoản chỉ có quyền đọc/ghi dữ liệu
      DB_PASSWORD: ${APP_DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    networks: [app_net, db_net]

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      webapp: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    networks: [app_net]

networks:
  app_net:                # Nginx và ứng dụng
  db_net:                 # Cơ sở dữ liệu. internal: true nên không có đường ra Internet và không publish được cổng
    internal: true
  mgmt:                   # Cổng quản trị chỉ bind vào 127.0.0.1

volumes:
  mysql_data:
