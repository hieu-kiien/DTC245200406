worker_processes auto;
pid /tmp/nginx.pid;                       # nginx chạy non-root nên ghi pid và thư mục tạm vào /tmp
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;                      # ẩn phiên bản Nginx

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Log dạng JSON để Loki tách trường bằng "| json"
  log_format json_log escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","args":"$args","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"referer":"$http_referer","ua":"$http_user_agent"}';
  access_log /dev/stdout json_log;

  # Giới hạn tốc độ: chỉ đếm request POST vào trang đăng nhập (10 lần/phút/IP) và form liên hệ (5 lần/phút/IP)
  map $request_method $post_key { default ""; POST $binary_remote_addr; }
  limit_req_zone $post_key zone=login:10m rate=10r/m;
  limit_req_zone $post_key zone=contact:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_status 429;

  client_max_body_size 1m;
  sendfile on;
  keepalive_timeout 30s;

  include /etc/nginx/conf.d/*.conf;
}
