upstream webapp {
  server webapp:3000;
}

# Cổng nội bộ cho nginx-prometheus-exporter, không publish ra ngoài
server {
  listen 8081;
  access_log off;
  location = /stub_status { stub_status; }
}

server {
  listen 8080;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:5m;
  ssl_session_timeout 1h;

  # Security headers. Viết ở cấp server, không viết lại add_header trong location để khỏi bị ghi đè.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $remote_addr;   # ghi đè, không nối thêm, để khách không giả được IP
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 30s;

  # Các đường dẫn chỉ dành cho mạng nội bộ
  location = /metrics   { return 404; }
  location /internal/   { return 404; }

  location = /admin/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://webapp;
  }

  location = /contact {
    limit_req zone=contact burst=3 nodelay;
    proxy_pass http://webapp;
  }

  location / {
    limit_req zone=general burst=40 nodelay;
    proxy_pass http://webapp;
  }
}
